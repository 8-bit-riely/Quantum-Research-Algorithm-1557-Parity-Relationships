name: Publish reviewed research package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-reviewed-package-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Verify archive, preserve introduction, and publish source
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import zipfile

          def require(ok, message):
              if not ok:
                  raise SystemExit(message)

          def git(*args, check=True):
              return subprocess.run(['git', *args], check=check)

          root = Path.cwd()
          archive = root / 'relational-operations-lab-github-2026-11-03.zip'
          require(archive.is_file() and not archive.is_symlink(), 'Missing regular archive file')
          require(sha256(archive.read_bytes()).hexdigest() ==
                  '9abac7616daca6f603fc1b7144d43f7f7d8a8a46b6f278bb6d99e4d5e36fc03b',
                  'Archive SHA-256 differs')
          prefix = 'relational-operations-lab/'
          skip = '.github/workflows/verify.yml'
          files = {}
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              require(len(entries) == 80, 'Expected exactly 80 regular archive files')
              for entry in entries:
                  name = entry.filename
                  path = PurePosixPath(name)
                  require(name.startswith(prefix) and path.as_posix() == name
                          and not path.is_absolute() and '\\' not in name and ':' not in name
                          and all(part not in ('', '.', '..') for part in name.split('/'))
                          and all(part.casefold() != '.git' for part in path.parts),
                          'Unsafe archive path')
                  require(not entry.is_dir() and stat.S_ISREG(entry.external_attr >> 16),
                          'Archive contains a non-regular file')
                  relative = name[len(prefix):]
                  require(relative and relative not in files, 'Duplicate or empty archive path')
                  require(not relative.startswith('.github/workflows/') or relative == skip,
                          'Unexpected packaged workflow')
                  files[relative] = bundle.read(entry)
          require(len(files) == 80 and skip in files, 'Archive inventory differs')

          # Check every packaged hash before any checkout file is changed.
          checksum_lines = files['CHECKSUMS.sha256'].splitlines(keepends=True)
          seen = set()
          for line in checksum_lines:
              digest, name = line.rstrip(b'\r\n').split(b'  ', 1)
              relative = name.decode('utf-8')
              require(re.fullmatch(rb'[0-9a-f]{64}', digest) and relative not in seen
                      and relative in files and relative != 'CHECKSUMS.sha256',
                      'Invalid packaged checksum entry')
              require(sha256(files[relative]).hexdigest().encode() == digest,
                      'Packaged checksum differs: ' + relative)
              seen.add(relative)
          require(seen == set(files) - {'CHECKSUMS.sha256'}, 'Incomplete packaged checksum inventory')

          readme = root / 'README.md'
          require(readme.is_file() and not readme.is_symlink(), 'Existing author README is required')
          introduction = readme.read_bytes()
          suffix = b'\n\n---\n\n' + files['README.md']
          merged = introduction if introduction.endswith(suffix) else introduction + suffix
          planned = {name: data for name, data in files.items() if name != skip}
          planned['README.md'] = merged
          planned['CHECKSUMS.sha256'] = b''.join(
              sha256(merged).hexdigest().encode() + line[64:]
              if line.rstrip(b'\r\n').split(b'  ', 1)[1] == b'README.md' else line
              for line in checksum_lines)

          # Refuse conflicts and linked paths before creating or overwriting anything.
          for name, data in planned.items():
              destination = root / name
              for parent in destination.parents:
                  if parent == root:
                      break
                  require(not parent.is_symlink() and (not parent.exists() or parent.is_dir()),
                          'Unsafe destination parent: ' + name)
              require(not destination.is_symlink(), 'Linked destination: ' + name)
              if destination.exists():
                  require(destination.is_file(), 'Non-file destination: ' + name)
                  existing = destination.read_bytes()
                  allowed = [data]
                  if name == 'README.md':
                      allowed.append(introduction)
                  if name == 'CHECKSUMS.sha256':
                      allowed.append(files[name])
                  require(existing in allowed, 'Existing file differs; no changes made: ' + name)
          git('diff', '--quiet')
          git('diff', '--cached', '--quiet')

          for name, data in planned.items():
              destination = root / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          paths = sorted(planned)
          require(not any(name.startswith('.github/workflows/') for name in paths),
                  'Workflow files must never be staged')
          subprocess.run(['git', 'add', '--', *paths], check=True)
          changed = git('diff', '--cached', '--quiet', check=False).returncode
          require(changed in (0, 1), 'Cannot inspect staged changes')
          if changed:
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('commit', '-m', 'Publish research source and preserve author introduction')
              git('push', 'origin', 'HEAD:main')
          else:
              print('Source and preserved README are already published; nothing to commit.')
          PY
